services:
  - type: web
    name: repoverse-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: LLM_PROVIDER
        value: none
      - key: MAX_REPO_SIZE_MB
        value: "100"
      - key: MAX_FILE_COUNT
        value: "2000"
      - key: CLONE_TIMEOUT_SECONDS
        value: "60"
      - key: REPO_STORAGE_PATH
        value: /tmp/repoverse_repos
